name: Windows quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-audit-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-build.txt --progress-spinner off

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build self-contained Windows application
        run: pyinstaller --noconfirm --clean AutoAudioSwitcher.spec

      - name: Verify packaged runtime without launching the UI
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\AutoAudioSwitcher\AutoAudioSwitcher.exe").Path
          $diagnosticsDir = Join-Path $env:RUNNER_TEMP "auto-audio-diagnostics"
          $arguments = @("--diagnostics", ('"--diagnostics-dir={0}"' -f $diagnosticsDir))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged runtime diagnostics failed with exit code $($process.ExitCode)."
          }
          Get-Content -LiteralPath (Join-Path $diagnosticsDir "runtime_diagnostics.json")
